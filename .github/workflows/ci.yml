name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Unit tests and conformance
        run: zig build check
      - name: XPath differential
        run: zig build xpath-diff
